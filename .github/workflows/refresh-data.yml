name: Refresh Lotto 6/45 data

on:
  workflow_dispatch:
  schedule:
    # 23:00 KST on Saturday and Sunday (UTC 14:00). GitHub may delay scheduled jobs.
    - cron: "0 14 * * 6,0"

permissions:
  contents: write

concurrency:
  group: lotto645-official-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: python -m pip install --upgrade pip pandas requests numpy

      - name: Fetch and validate official draw history
        id: sync
        run: python sync_data.py

      # Always publish sync_status.json when the sync script has created it.
      # Do not require lotto645.csv to exist: a failed first sync may not create it.
      - name: Commit data and sync status
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          if [ -d data ]; then
            git add -A data/
          else
            echo "No data directory was created by the sync step."
          fi

          if git diff --cached --quiet; then
            echo "No data or sync status changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): refresh Lotto 6/45 history/status"
            git push
          fi
