name: Refresh Lotto 6/45 data

on:
  workflow_dispatch:
  schedule:
    # 23:00 KST on Saturday and Sunday (UTC 14:00). GitHub may delay scheduled jobs.
    - cron: "0 14 * * 6,0"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sync dependencies
        run: python -m pip install --upgrade pip pandas requests numpy
      - name: Fetch and validate draw history
        run: python sync_data.py
      - name: Commit updated draw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto645.csv data/sync_status.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh Lotto 6/45 draw history"
            git push
          fi
