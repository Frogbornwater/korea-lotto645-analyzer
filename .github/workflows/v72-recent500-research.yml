name: V7.2 recent-500 expanding research

on:
  push:
    branches: ["research/v72-recent500-expanding-study"]
  pull_request:
    branches: ["main"]

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile V7.2 research and tests
        run: python -m py_compile scripts/v72_recent500_research.py tests/test_v72_recent500_research.py
      - name: Run V7.2 unit tests
        run: python -m unittest tests.test_v72_recent500_research -v
      - name: Run recent-500 expanding prequential research
        run: python scripts/v72_recent500_research.py
      - name: Upload V7.2 research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v72-recent500-expanding-research
          path: artifacts/v72/
          if-no-files-found: error
          retention-days: 90
