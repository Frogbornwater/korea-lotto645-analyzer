name: V7.3 recent-800 expanding research

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/v73_recent800_research.py"
      - "tests/test_v73_recent800_research.py"
      - "data/lotto645.csv"
      - "lotto_core.py"
      - "v50_predictive_engine.py"
      - "requirements.txt"
      - ".github/workflows/v73-recent800-research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile V7.3 research and tests
        run: python -m py_compile scripts/v73_recent800_research.py tests/test_v73_recent800_research.py
      - name: Run V7.3 unit tests
        run: python -m unittest discover -s tests -p 'test_v73_recent800_research.py' -v
      - name: Run recent-800 expanding prequential research
        run: python scripts/v73_recent800_research.py
      - name: Upload V7.3 research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v73-recent800-expanding-research
          path: artifacts/v73/
          if-no-files-found: error
          retention-days: 90
