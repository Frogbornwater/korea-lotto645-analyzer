name: V7.5 alternative model-family research

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/v75_model_family_research.py"
      - "tests/test_v75_model_family_research.py"
      - "scripts/v74_recent1000_research.py"
      - "data/lotto645.csv"
      - "lotto_core.py"
      - "v50_backtest.py"
      - "v50_predictive_engine.py"
      - "requirements.txt"
      - ".github/workflows/v75-model-family-research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile V7.5 research and tests
        run: python -m py_compile scripts/v75_model_family_research.py tests/test_v75_model_family_research.py
      - name: Run V7.5 unit tests
        run: python -m unittest discover -s tests -p 'test_v75_model_family_research.py' -v
      - name: Run recent-1000 model-family prequential research
        run: python scripts/v75_model_family_research.py
      - name: Upload V7.5 research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v75-model-family-research
          path: artifacts/v75/
          if-no-files-found: error
          retention-days: 90
