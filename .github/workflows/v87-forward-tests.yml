name: V8.7 forward protocol tests

on:
  pull_request:
    branches: [main]
    paths:
      - "v87_forward_protocol.py"
      - "scripts/v87_forward_protocol.py"
      - "tests/test_v87_forward_protocol.py"
      - "V8.7_FORWARD_VALIDATION.md"
      - ".github/workflows/v87-forward-protocol.yml"
      - ".github/workflows/v87-forward-tests.yml"
      - "v50_predictive_engine.py"
      - "v81_batch_sampler.py"
      - "v85_hybrid_portfolio.py"
  push:
    branches: [main]
    paths:
      - "v87_forward_protocol.py"
      - "scripts/v87_forward_protocol.py"
      - "tests/test_v87_forward_protocol.py"
      - ".github/workflows/v87-forward-tests.yml"

jobs:
  forward-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile V8.7 modules
        run: python -m py_compile v87_forward_protocol.py scripts/v87_forward_protocol.py
      - name: Run V8.7 forward protocol tests
        run: python -m unittest discover -s tests -p "test_v87_forward_protocol.py" -v
      - name: Run V5 predictor regression tests
        run: python -m unittest discover -s tests -p "test_v50_predictive_engine.py" -v
      - name: Run V8.1 batch sampler regression tests
        run: python -m unittest discover -s tests -p "test_v81_batch_sampler.py" -v
