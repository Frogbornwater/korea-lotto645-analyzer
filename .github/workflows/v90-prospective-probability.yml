name: V9.0 prospective probability audit tests

on:
  pull_request:
    branches: [main]
    paths:
      - "v90_prospective_probability.py"
      - "v89_prospective_cohort.py"
      - "scripts/v90_prospective_probability.py"
      - "tests/test_v90_prospective_probability.py"
      - "V9.0_PROSPECTIVE_PROBABILITY.md"
      - ".github/workflows/v90-prospective-probability.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile v89_prospective_cohort.py v90_prospective_probability.py scripts/v90_prospective_probability.py
      - run: python -m unittest discover -s tests -p "test_v90_prospective_probability.py" -v
      - run: python -m unittest discover -s tests -p "test_v89_prospective_cohort.py" -v
      - run: python -m unittest discover -s tests -p "test_v87_forward_protocol.py" -v
