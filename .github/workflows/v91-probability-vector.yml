name: V9.1 prospective probability-vector calibration
on:
  pull_request:
    paths:
      - "v87_forward_protocol.py"
      - "v91_probability_vector.py"
      - "tests/test_v87_forward_protocol.py"
      - "tests/test_v91_probability_vector.py"
      - ".github/workflows/v91-probability-vector.yml"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "v87_forward_protocol.py"
      - "v91_probability_vector.py"
      - "tests/test_v87_forward_protocol.py"
      - "tests/test_v91_probability_vector.py"
      - ".github/workflows/v91-probability-vector.yml"
      - "requirements.txt"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile v87_forward_protocol.py v91_probability_vector.py
      - run: python -m unittest discover -s tests -p "test_v91_probability_vector.py" -v
      - run: python -m unittest discover -s tests -p "test_v87_forward_protocol.py" -v
      - run: python -m unittest discover -s tests -p "test_v89_prospective_cohort.py" -v
