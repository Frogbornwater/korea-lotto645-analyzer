name: V9.2 draw-clustered calibration uncertainty
on:
  pull_request:
    paths:
      - "v92_calibration_uncertainty.py"
      - "tests/test_v92_calibration_uncertainty.py"
      - ".github/workflows/v92-calibration-uncertainty.yml"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "v92_calibration_uncertainty.py"
      - "tests/test_v92_calibration_uncertainty.py"
      - ".github/workflows/v92-calibration-uncertainty.yml"
      - "requirements.txt"
jobs:
  calibration-uncertainty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile v92_calibration_uncertainty.py
      - run: python -m unittest discover -s tests -p "test_v92_calibration_uncertainty.py" -v
      - run: python -m unittest discover -s tests -p "test_v91_probability_vector.py" -v
