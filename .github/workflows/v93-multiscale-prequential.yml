name: V9.3 Multi-timescale prequential research
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "v93_multiscale_prequential.py"
      - "tests/test_v93_multiscale_prequential.py"
      - ".github/workflows/v93-multiscale-prequential.yml"
      - "V9.3_MULTISCALE_RESEARCH.md"
  push:
    branches: [main]
    paths:
      - "v93_multiscale_prequential.py"
      - "tests/test_v93_multiscale_prequential.py"
      - ".github/workflows/v93-multiscale-prequential.yml"
jobs:
  multiscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - run: python -m py_compile v93_multiscale_prequential.py
      - run: python -m unittest discover -s tests -p "test_v93_multiscale_prequential.py" -v
      - name: Run frozen-data prequential study
        run: python v93_multiscale_prequential.py --csv data/lotto645.csv --output /tmp/v93_multiscale_report.json --bootstrap-reps 10000
      - uses: actions/upload-artifact@v4
        with:
          name: v93-multiscale-prequential-report
          path: /tmp/v93_multiscale_report.json
